[package]
name = "canopy"
description = "Canopy: one window for Forma, Folio, StreamCuts and Moodie"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
canopy-core = { path = "../canopy-core" }
canopy-ui = { path = "../canopy-ui" }
dirs = "7.0.0"
eframe = "0.37.0"
egui = "0.37.0"
rfd = "0.17.2"
drag = "2.1.1"
raw-window-handle = "0.6"
streamcuts = { path = "../../../../streamcuts/native" }
forma-native = { path = "../../../../forma-studio/native" }
folio-native = { path = "../../../../folio-carousel-studio/native" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "webp"] }
